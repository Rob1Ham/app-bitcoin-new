name: GitHub release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: read

jobs:
  github-release:
    name: GitHub release using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_app_release.yml@8423c8f0ce7eec622e5d3ea20e07dfcc03f22480
    if: startsWith(github.ref, 'refs/tags/')
    with:
      app_ref_name: ${{ github.ref_name }}
